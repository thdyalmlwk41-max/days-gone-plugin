name: Build Days Gone 900p Patch

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps4dev/orbisdev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build SPRX
        run: |
          cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ORBISDEV/toolchain.cmake
          cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: days_gone_900p_sprx
          path: build/*.sprx
          retention-days: 30
