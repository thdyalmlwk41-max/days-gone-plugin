name: Build Days Gone 900p Patch

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld git

      - name: Setup OpenOrbis SDK
        run: |
          git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git $HOME/OOPS4Toolchain
          echo "OO_PS4_TOOLCHAIN=$HOME/OOPS4Toolchain" >> $GITHUB_ENV

      - name: Build SPRX
        run: |
          export OO_PS4_TOOLCHAIN=$HOME/OOPS4Toolchain
          cd CE
          cmake -B build -G "Unix Makefiles" -DCMAKE_TOOLCHAIN_FILE=$HOME/OOPS4Toolchain/toolchain/Toolchain.cmake
          cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: days_gone_900p_sprx
          path: CE/build/*.sprx
          retention-days: 30
