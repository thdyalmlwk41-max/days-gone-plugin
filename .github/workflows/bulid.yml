name: Build Days Gone 900p Patch

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential make clang lld git

      - name: Setup OpenOrbis SDK
        run: |
          git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git $HOME/OOPS4Toolchain
          cd $HOME/OOPS4Toolchain
          # إعداد مسارات Toolchain
          if [ -f "extract.sh" ]; then chmod +x extract.sh && ./extract.sh; fi

      - name: Build SPRX
        run: |
          export OO_PS4_TOOLCHAIN=$HOME/OOPS4Toolchain
          cd CE
          
          # البحث عن ملف toolchain المتاحة تلقائياً
          TOOLCHAIN_FILE=$(find $HOME/OOPS4Toolchain -name "*.toolchain.cmake" -o -name "Toolchain.cmake" | head -n 1)
          echo "Using Toolchain: $TOOLCHAIN_FILE"
          
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN_FILE
          cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: days_gone_900p_sprx
          path: CE/build/*.sprx
          retention-days: 30
