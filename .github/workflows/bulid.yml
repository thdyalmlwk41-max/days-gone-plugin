name: Build Days Gone 900p Patch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: orbisdev/ps4-sdk:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            cmake \
            ninja-build \
            python3 \
            git

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/opt/ps4/toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Verify output
        run: |
          ls -la build/
          file build/days_gone_900p.sprx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: days_gone_900p_sprx
          path: build/days_gone_900p.sprx
          retention-days: 30

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/days_gone_900p.sprx
          generate_release_notes: true
